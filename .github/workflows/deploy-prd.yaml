name: Deploy PRD

on:
  push:
    branches: [main]
  workflow_dispatch:

# Serialize PRD deploys per ref. Unlike Deploy DEV ("newest commit wins"),
# production deploys must NEVER be killed mid-flight: cancelling halfway
# through `docker compose recreate` produces half-renamed Created-state
# containers and a broken host. Queue subsequent deploys instead.
concurrency:
  group: deploy-prd-${{ github.ref }}
  cancel-in-progress: false

env:
  DOCKER_TAGS: zkcoins/app:latest

permissions:
  contents: read

jobs:
  build-and-deploy:
    name: Build and deploy to PRD
    runs-on: ubuntu-24.04-arm
    steps:
      # App-only checkout. `@zkcoins/sdk` is a git dependency pinned in
      # package.json (github:zk-coins/sdk#feat/v1-cross-parity) — `npm ci`
      # inside the Docker build resolves it (lockfile pins the commit SHA).
      # Flip to published `@zkcoins/sdk@^0.4.0` on the release cutover.
      - name: Checkout
        uses: actions/checkout@v4

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push Docker image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile
          push: true
          tags: ${{ env.DOCKER_TAGS }}
          platforms: linux/arm64

      - name: Install cloudflared
        run: |
          curl -fsSL https://github.com/cloudflare/cloudflared/releases/download/2025.4.0/cloudflared-linux-arm64 -o /usr/local/bin/cloudflared
          chmod +x /usr/local/bin/cloudflared

      - name: Deploy to PRD
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.DEPLOY_PRD_SSH_KEY }}" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          echo "${{ secrets.DEPLOY_PRD_SSH_KNOWN_HOSTS }}" > ~/.ssh/known_hosts
          ssh -i ~/.ssh/deploy_key \
            -o ProxyCommand="cloudflared access ssh --hostname ${{ secrets.DEPLOY_PRD_HOST }}" \
            ${{ secrets.DEPLOY_PRD_USER }}@${{ secrets.DEPLOY_PRD_HOST }} \
            "zkcoins-app"
