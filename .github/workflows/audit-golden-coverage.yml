name: Audit Golden Coverage

on:
  # Runs on every pull request regardless of target branch so the
  # feature → staging → develop → main flow gets a pre-merge audit
  # gate at every layer. Mirrors `audit-button-coverage.yml`.
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
    paths:
      - 'src/**'
      - 'e2e/**'
      - '.github/workflows/audit-golden-coverage.yml'
  push:
    branches: [develop]
    paths:
      - 'src/**'
      - 'e2e/**'
      - '.github/workflows/audit-golden-coverage.yml'

# Group by PR number (with `github.ref` fallback for push/dispatch) so a
# new push cancels the in-flight audit on the outdated commit. See
# `ci.yaml` for the full rationale — same fix, same pattern.
concurrency:
  group: audit-golden-coverage-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  pull-requests: write

jobs:
  audit:
    name: Golden-Coverage-Audit
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Run audit (strict)
        id: audit
        run: |
          {
            echo 'report<<AUDIT_EOF'
            node e2e/_audit/golden-coverage.mjs --markdown
            echo 'AUDIT_EOF'
          } >> "$GITHUB_OUTPUT"
          node e2e/_audit/golden-coverage.mjs

      - name: Post sticky PR comment
        if: github.event_name == 'pull_request'
        continue-on-error: true
        uses: marocchino/sticky-pull-request-comment@v2
        with:
          header: audit-golden-coverage
          message: ${{ steps.audit.outputs.report }}
