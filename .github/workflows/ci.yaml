name: CI

on:
  # CI runs on every pull request regardless of target branch. This
  # makes the default safe for the feature → staging → develop → main
  # flow introduced in #138 and for any future stacked-PR shape —
  # previously such PRs were silently skipped because
  # `branches: [develop]` filtered them out, leaving every staging-
  # bound PR without a pre-merge gate. Mirrors the node-side trigger
  # shape in `zk-coins/node::ci.yaml`.
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
  # `push: develop` keeps the authoritative post-merge gate. The
  # release PR (develop → main) re-runs CI on its own `synchronize`
  # event, but the app's release PR has no equivalent `ci:full` /
  # heavy-gate semantics, so the push trigger remains as the canonical
  # source of truth for the post-merge SHA.
  push:
    branches: [develop]

# Group by PR number so a new push to the same PR cancels the in-flight
# run for the outdated commit. Grouping by SHA (the previous approach)
# put every commit in its own group, which meant `cancel-in-progress`
# never fired and back-to-back pushes queued sequentially — each new
# commit waited for the doomed older run to drain.
# Falls back to `github.ref` for push/dispatch events (where there is no
# `pull_request.number`): `refs/heads/develop` for post-merge runs, the
# dispatched ref for manual triggers.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  lint-and-build:
    name: Lint & Build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npx next lint

      - name: Prettier
        run: npx prettier --check "src/**/*.{ts,tsx}"

      - name: Build
        run: npm run build

  unit-tests:
    name: Unit Tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run unit tests
        run: npm test

      - name: Run unit tests with coverage
        run: npm run test:coverage

  e2e-tests:
    name: E2E Tests
    runs-on: ubuntu-latest
    needs: [lint-and-build]
    # ── Served-local E2E: CI tests the PR's OWN build ─────────────────
    #
    # This job builds the PR's standalone bundle, serves it on the
    # runner, and drives the Playwright suite against it. The upstream
    # node is the project's CI node at ci.zkcoins.app, fronted by the
    # test-only /v1/info normalisation proxy (scripts/e2e-info-proxy.mjs)
    # so the capability surface matches the committed baselines.
    #
    # Why ci.zkcoins.app and not dev-api.zkcoins.app? The CI node is
    # ci.zkcoins.app — the dedicated Mutinynet node used as the E2E
    # upstream (real ZK proof gen + real Mutinynet broadcast).
    #
    # Why not the previous shape (navigate to https://dev.zkcoins.app)?
    # That tested whatever frontend was DEPLOYED — i.e. `develop` —
    # not the PR's code. During the Jobs-API migration that gap became
    # load-bearing: the node dropped legacy mint/send while the
    # deployed frontend still called them, so every frontend-behaviour
    # spec was red for reasons unrelated to the PR under test
    # (deployment lag). Serving the PR's own build removes the lag
    # term entirely: a red E2E now means the PR is wrong, not that the
    # deploy queue is behind. A real *node* stays the upstream (real ZK
    # proof gen, real broadcast) — now ci.zkcoins.app, see above.
    #
    # Baseline platform: the committed *-chromium-linux.png baselines
    # are rendered by Linux Chromium. This job runs on ubuntu-latest,
    # so the visual diffs compare like-for-like (same platform the
    # regenerate-visual-baselines workflow uses). The developer-machine
    # equivalent is `npm run test:e2e:local` (Docker, same image
    # family) — see e2e/README.md § 4.2.
    #
    # Cap the job so a hung browser process or stuck globalSetup
    # cannot consume the default 6 h budget. Realistic wall-clock is
    # ~5-10 min for the single chromium suite plus ~3 min for
    # install/browser-fetch and ~1 min for the standalone build —
    # 30 min is the conservative ceiling.
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium

      # Build the PR's standalone bundle. NEXT_PUBLIC_* is inlined at
      # build time. v1 chan_bind is H("zkCoins/v1/PullHost" ‖ host)
      # from the SDK apiUrl, and the CI upstream API is configured
      # with PUBLIC_HOST=127.0.0.1:8080, so the baked browser URL and
      # the runner info-proxy must share that same authority — not
      # the Next origin :3090 and not the historical :4243 split.
      # LOCAL_NODE_PROXY_TARGET stays pointed at the info-proxy so a
      # same-origin /v1 rewrite still works if a call hits Next.
      - name: Build standalone bundle (chan_bind host baked in)
        run: npm run build
        env:
          NEXT_PUBLIC_API_URL: http://127.0.0.1:8080
          NEXT_PUBLIC_EXPLORER_URL: https://zkcoins.space
          LOCAL_NODE_PROXY_TARGET: http://127.0.0.1:8080
          # Baselines and spec copy are English. Unset → default `de`
          # and every wallet chrome shot diffs (see i18n/config.ts).
          NEXT_PUBLIC_E2E_LOCALE: en

      # `output: standalone` emits a minimal server tree but does not
      # copy `public/` or `.next/static` into it (the Dockerfile does
      # this manually). Mirror that here so the standalone server can
      # serve assets + static chunks.
      - name: Assemble standalone tree
        run: |
          cp -r public .next/standalone/public
          mkdir -p .next/standalone/.next
          cp -r .next/static .next/standalone/.next/static

      # Serve + test in ONE step so the background proxy/server share
      # this step's lifetime (no cross-step process reaping concerns).
      #
      # Single chromium run covers the suite. globalSetup runs once and
      # mints fresh Alice + Bob via POST /v1/tx kind=mint.
      - name: Serve standalone build + run E2E (chromium)
        run: |
          set -euo pipefail

          node scripts/e2e-info-proxy.mjs &
          PROXY_PID=$!
          PORT=3090 HOSTNAME=127.0.0.1 node .next/standalone/server.js &
          APP_PID=$!
          trap 'kill "$PROXY_PID" "$APP_PID" 2>/dev/null || true' EXIT

          echo "waiting for info-proxy :8080 and app :3090"
          for i in $(seq 1 60); do
            if curl -sf --max-time 3 http://127.0.0.1:8080/v1/info >/dev/null 2>&1 &&
              curl -sf --max-time 3 http://127.0.0.1:3090/ >/dev/null 2>&1; then
              break
            fi
            if [ "$i" = "60" ]; then
              echo "::error::info-proxy or standalone app did not come up within 60s"
              echo -n "proxy /v1/info http="
              curl -sS -o /tmp/proxy-info.body -w "%{http_code}" --max-time 5 http://127.0.0.1:8080/v1/info || true
              echo
              head -c 400 /tmp/proxy-info.body 2>/dev/null || true
              echo
              echo -n "app / http="
              curl -sS -o /dev/null -w "%{http_code}" --max-time 5 http://127.0.0.1:3090/ || true
              echo
              exit 1
            fi
            sleep 1
          done

          # Sanity: the proxy must report the DEV capability surface
          # (wallet feature OFF). A mismatch would silently shift baselines,
          # so fail loud here instead of in a wall of visual diffs.
          PROXY_INFO="$(curl -s --max-time 5 http://127.0.0.1:8080/v1/info)"
          echo "proxied /v1/info → ${PROXY_INFO}"
          case "$PROXY_INFO" in
            *'"wallet"'*)
              echo "::error::proxy did not normalise features away from wallet (username claim)"
              exit 1
              ;;
          esac

          # Send is unavailable in this build (no input-coin inventory);
          # there is no send-success leg. Single chromium run covers the suite.
          npx playwright test --project=chromium
        env:
          E2E_TARGET: local
          E2E_BASE_URL: http://127.0.0.1:3090
          E2E_API_URL: http://127.0.0.1:8080
          E2E_LOCAL_APP_PORT: '3090'
          E2E_INFO_PROXY_PORT: '8080'
          E2E_NODE_URL: https://ci.zkcoins.app
          E2E_INFO_USERNAME_DOMAIN: dev.zkcoins.app
          E2E_FAUCET_CALLS: '1'
          E2E_NEED_FIXTURES: 'true'
          # Fixture wallets whose blossom `op` keys are already on the
          # CI node's upload allow-list. Fresh random wallets 403 at
          # finalise (kind-24242). globalSetup / create-success restore
          # these instead of generating a new seed.
          E2E_ALICE_MNEMONIC: ${{ secrets.E2E_ALICE_MNEMONIC }}
          E2E_BOB_MNEMONIC: ${{ secrets.E2E_BOB_MNEMONIC }}
          E2E_CREATE_MNEMONIC: ${{ secrets.E2E_CREATE_MNEMONIC }}

      - name: Upload test results
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7

      - name: Upload screenshots
        uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: test-screenshots
          path: test-results/
          retention-days: 7
