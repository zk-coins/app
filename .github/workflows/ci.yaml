name: CI

on:
  # CI runs on every pull request regardless of target branch. This
  # makes the default safe for the feature → staging → develop → main
  # flow introduced in #138 and for any future stacked-PR shape —
  # previously such PRs were silently skipped because
  # `branches: [develop]` filtered them out, leaving every staging-
  # bound PR without a pre-merge gate. Mirrors the node-side trigger
  # shape in `zk-coins/node::ci.yaml`.
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
  # `push: develop` keeps the authoritative post-merge gate. The
  # release PR (develop → main) re-runs CI on its own `synchronize`
  # event, but the app's release PR has no equivalent `ci:full` /
  # heavy-gate semantics, so the push trigger remains as the canonical
  # source of truth for the post-merge SHA.
  push:
    branches: [develop]

# Group by PR number so a new push to the same PR cancels the in-flight
# run for the outdated commit. Grouping by SHA (the previous approach)
# put every commit in its own group, which meant `cancel-in-progress`
# never fired and back-to-back pushes queued sequentially — each new
# commit waited for the doomed older run to drain.
# Falls back to `github.ref` for push/dispatch events (where there is no
# `pull_request.number`): `refs/heads/develop` for post-merge runs, the
# dispatched ref for manual triggers.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  lint-and-build:
    name: Lint & Build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npx next lint

      - name: Prettier
        run: npx prettier --check "src/**/*.{ts,tsx}"

      - name: Build
        run: npm run build

  unit-tests:
    name: Unit Tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run unit tests
        run: npm test

      - name: Run unit tests with coverage
        run: npm run test:coverage

  rust-tests:
    name: Rust Crypto Tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            rust/target
          key: ${{ runner.os }}-cargo-rust-${{ hashFiles('rust/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-rust-

      - name: Run shared crate tests
        working-directory: rust
        run: cargo test -p shared

  e2e-tests:
    name: E2E Tests
    runs-on: ubuntu-latest
    needs: [lint-and-build]
    # Cap the job so a hung browser process or stuck globalSetup
    # cannot consume the default 6 h budget. Realistic wall-clock is
    # ~5-7 min (step 1: 3 min parallel, step 2: 2-4 min serial) plus
    # ~3 min for install/browser-fetch — 30 min is the conservative
    # ceiling.
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium

      # Two-step E2E run.
      #
      # Step 1 runs the parallel-safe bulk of the suite (75 specs) with
      # the default fullyParallel: true + 2 workers — the fast path that
      # exercises onboarding, balance, network, PWA, redirects, and the
      # 12 non-mutating Send tests.
      #
      # Step 2 runs the single `send-success` test on its own with
      # --workers=1. send-success is the one spec that drives a real
      # /api/send + /api/commit through the DEV node, blocking on
      # server-side ZK proof generation. Running it concurrently with
      # the rest of the suite (mint/balance traffic from 09 / 10 / 11
      # all hitting the same node) starved its proof-gen pipeline for
      # minutes at a time, causing repeated test-timeout failures even
      # at a 12-min budget. Giving it exclusive DEV-node bandwidth
      # drops the realistic upper bound back to ~3-4 min and removes
      # the parallel-load term from the variance.
      #
      # globalSetup runs once per playwright invocation and mints
      # fresh Alice + Bob, so each step gets a clean fixture set —
      # step 2 doesn't depend on step 1's Alice having any specific
      # remaining balance. See e2e/README.md § 4 and § 5.
      - name: Run E2E tests (parallel, excluding send-success)
        run: npx playwright test --project=chromium --grep-invert "send-success"
        env:
          E2E_BASE_URL: https://dev.zkcoins.app
          E2E_API_URL: https://dev-api.zkcoins.app
          E2E_NETWORK_EXPECTED: signet
          E2E_FAUCET_CALLS: '1'
          E2E_NEED_FIXTURES: 'true'

      - name: Run E2E tests (send-success, exclusive DEV-node bandwidth)
        run: npx playwright test --project=chromium --grep "send-success" --workers=1
        env:
          E2E_BASE_URL: https://dev.zkcoins.app
          E2E_API_URL: https://dev-api.zkcoins.app
          E2E_NETWORK_EXPECTED: signet
          E2E_FAUCET_CALLS: '1'
          E2E_NEED_FIXTURES: 'true'

      - name: Upload test results
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7

      - name: Upload screenshots
        uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: test-screenshots
          path: test-results/
          retention-days: 7
