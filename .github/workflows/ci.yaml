name: CI

on:
  # Only trigger PRs against `develop`. The release PR (develop → main)
  # is opened automatically by `auto-release-pr.yaml`, so `main` is
  # deliberately omitted from `pull_request.branches`: a `push: develop`
  # already covers each new SHA, and adding a PR-side trigger on `main`
  # would queue a second `pull_request` run against the release PR for
  # the very same commit — wasted CI minutes on a check `push: develop`
  # already provides.
  #
  # Note: under the PR-number grouping in the `concurrency` block below
  # the two runs would land in DIFFERENT groups (PR run keyed by PR
  # number, push run keyed by `refs/heads/develop`), so the block would
  # NOT deduplicate them. The omission is still correct — it avoids
  # double-loading the same SHA — but the previous "concurrency cancels
  # one of them" reasoning is obsolete.
  pull_request:
    branches: [develop]
  push:
    branches: [develop]

# Group by PR number so a new push to the same PR cancels the in-flight
# run for the outdated commit. Grouping by SHA (the previous approach)
# put every commit in its own group, which meant `cancel-in-progress`
# never fired and back-to-back pushes queued sequentially — each new
# commit waited for the doomed older run to drain.
# Falls back to `github.ref` for push/dispatch events (where there is no
# `pull_request.number`): `refs/heads/develop` for post-merge runs, the
# dispatched ref for manual triggers.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  lint-and-build:
    name: Lint & Build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npx next lint

      - name: Prettier
        run: npx prettier --check "src/**/*.{ts,tsx}"

      - name: Build
        run: npm run build

  unit-tests:
    name: Unit Tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run unit tests
        run: npm test

      - name: Run unit tests with coverage
        run: npm run test:coverage

  rust-tests:
    name: Rust Crypto Tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            rust/target
          key: ${{ runner.os }}-cargo-rust-${{ hashFiles('rust/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-rust-

      - name: Run shared crate tests
        working-directory: rust
        run: cargo test -p shared

  e2e-tests:
    name: E2E Tests
    runs-on: ubuntu-latest
    needs: [lint-and-build]
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium

      - name: Run E2E tests (all including visual regression)
        run: npx playwright test --project=chromium
        env:
          E2E_BASE_URL: https://dev.zkcoins.app
          E2E_API_URL: https://dev-api.zkcoins.app
          E2E_NETWORK_EXPECTED: signet
          E2E_FAUCET_CALLS: '1'
          # globalSetup runs once per CI invocation and mints fresh Alice + Bob
          # via /api/mint. The active specs (03-restore-seed et al.) consume
          # the resulting e2e/.fixtures/accounts.json via aliceLogin/bobLogin.
          # Legacy specs are unaffected — they create their own throwaway
          # wallets inline. See e2e/README.md § 4 and § 5.
          E2E_NEED_FIXTURES: 'true'

      - name: Upload test results
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7

      - name: Upload screenshots
        uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: test-screenshots
          path: test-results/
          retention-days: 7
