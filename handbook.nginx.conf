server {
    listen 8080 default_server;
    server_name _;

    # Emit relative Location headers so redirects work behind a tunnel —
    # otherwise nginx prepends the internal listen address and the browser
    # follows a host it cannot reach.
    absolute_redirect off;

    root /usr/share/nginx/html;
    index index.html;

    # Hide nginx version in Server header.
    server_tokens off;

    # Casual access gate — keeps the handbook out of public crawlers and
    # casual visitors, not a hard security boundary. Local builds use the
    # baked-in handbook.htpasswd placeholder as-is. Real DEV/PRD deploys
    # overwrite handbook.htpasswd with real credentials from the
    # HANDBOOK_HTPASSWD secret before the image is built (see
    # .github/workflows/handbook-deploy.yaml) — rotate real credentials by
    # updating that secret, not this file. /healthz bypasses auth so the
    # Dockerfile HEALTHCHECK and deploy smoke check stay simple without
    # leaking the password into workflows.
    auth_basic "zkCoins App Handbook";
    auth_basic_user_file /etc/nginx/handbook.htpasswd;

    # Security headers for a static, embed-safe handbook.
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    # Behind a Basic-Auth gate: never let a shared cache store responses.
    add_header Cache-Control "private, no-store" always;

    # Gzip text assets — screenshots are PNG and skip compression.
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types
        text/plain
        text/css
        text/javascript
        application/javascript
        application/json
        image/svg+xml;

    # Unauthenticated health endpoint — used by the Dockerfile HEALTHCHECK
    # and the handbook deploy smoke test. Returns 200 without disclosing
    # handbook content. nginx's add_header inheritance is all-or-nothing
    # per location, so the server-level security headers are restated here.
    location = /healthz {
        auth_basic off;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Cache-Control "no-store" always;
        default_type text/plain;
        return 200 "OK\n";
    }

    # English is the default language shell.
    location = / {
        return 302 /handbook/;
    }

    location / {
        try_files $uri $uri/ =404;
    }
}
